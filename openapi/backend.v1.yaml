openapi: 3.1.0
info:
  title: LexMapa Backend API
  version: 0.1.0
  description: API inicial para comparar cambios legales en lenguaje simple y consultar read models aprobados.
servers:
  - url: https://api.lexmapa.example
    description: Placeholder de produccion
paths:
  /change-proposals:
    get:
      summary: Lista propuestas o reformas con comparacion legal disponible
      responses:
        "200":
          description: Propuestas disponibles
          content:
            application/json:
              schema:
                type: object
                required:
                  - proposals
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegalChangeProposalOverview"
  /change-proposals/{id}:
    get:
      summary: Obtiene una propuesta con resumen, temas, grupos y diffs
      parameters:
        - $ref: "#/components/parameters/ChangeProposalId"
      responses:
        "200":
          description: Propuesta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalChangeProposal"
        "404":
          description: Propuesta no encontrada
  /change-proposals/{id}/diffs:
    get:
      summary: Obtiene los cambios articulo por articulo de una propuesta
      parameters:
        - $ref: "#/components/parameters/ChangeProposalId"
      responses:
        "200":
          description: Diffs disponibles
          content:
            application/json:
              schema:
                type: object
                required:
                  - proposalId
                  - diffs
                properties:
                  proposalId:
                    type: string
                  diffs:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegalDiff"
        "404":
          description: Propuesta no encontrada
  /legal-items:
    get:
      summary: Lista items legales aprobados
      responses:
        "200":
          description: Items legales disponibles
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegalItemOverview"
  /legal-items/{id}/overview:
    get:
      summary: Obtiene una ficha simple de item legal
      parameters:
        - $ref: "#/components/parameters/LegalItemId"
      responses:
        "200":
          description: Ficha simple aprobada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalItemOverview"
        "404":
          description: Item no encontrado
  /legal-items/{id}/freshness:
    get:
      summary: Obtiene estado de actualizacion del item legal
      parameters:
        - $ref: "#/components/parameters/LegalItemId"
      responses:
        "200":
          description: Estado de freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreshnessInfo"
        "404":
          description: Item no encontrado
  /search:
    get:
      summary: Busca en lenguaje simple propuestas de cambio y, si existen, items legales aprobados
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Resultados de busqueda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: Query vacia
components:
  parameters:
    LegalItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ChangeProposalId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    LegalChangeProposalOverview:
      type: object
      required:
        - id
        - title
        - status
        - chamber
        - statusLabelForUsers
        - scheduledTreatmentDate
        - committees
        - summaryPlainLanguage
        - affectedTopics
        - affectedGroups
        - diffCount
        - dataStatus
        - dataKind
        - priority
        - sourceStatus
        - sourceLinks
        - source
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        chamber:
          type: string
          enum:
            - SENATE
            - DEPUTIES
        statusLabelForUsers:
          type: string
        scheduledTreatmentDate:
          type: string
        committees:
          type: array
          items:
            type: string
        summaryPlainLanguage:
          type: string
        affectedTopics:
          type: array
          items:
            type: string
        affectedGroups:
          type: array
          items:
            type: string
        diffCount:
          type: integer
          minimum: 0
        dataStatus:
          type: string
        dataKind:
          type: string
          enum:
            - REAL_AGENDA_ITEM
        priority:
          type: string
        sourceStatus:
          type: string
          enum:
            - LOADED
            - PENDING
        sourceLinks:
          $ref: "#/components/schemas/ChangeProposalSourceLinks"
        source:
          $ref: "#/components/schemas/LegalSource"
    LegalChangeProposalSearchResult:
      allOf:
        - $ref: "#/components/schemas/LegalChangeProposalOverview"
        - type: object
          required:
            - matchedDiffIds
            - matchedTopicIds
            - matchedGroupIds
            - matchSummary
          properties:
            matchedDiffIds:
              type: array
              items:
                type: string
            matchedTopicIds:
              type: array
              items:
                type: string
            matchedGroupIds:
              type: array
              items:
                type: string
            matchSummary:
              type: string
    SearchResponse:
      type: object
      required:
        - query
        - proposals
        - items
      properties:
        query:
          type: string
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/LegalChangeProposalSearchResult"
        items:
          type: array
          items:
            $ref: "#/components/schemas/LegalItemOverview"
        itemsUnavailable:
          type: object
          properties:
            error:
              type: string
            message:
              type: string
            dataset:
              type: object
              properties:
                mode:
                  type: string
                disposable:
                  type: boolean
                warning:
                  type: string
            servingPolicy:
              type: object
              additionalProperties: true
    LegalChangeProposal:
      type: object
      required:
        - id
        - title
        - status
        - chamber
        - statusLabelForUsers
        - scheduledTreatmentDate
        - committees
        - officialDescription
        - plainLanguageSummary
        - summary
        - topics
        - affectedGroups
        - diffs
        - source
        - sourceLinks
        - sourceStatus
        - priority
        - dataKind
        - importedFrom
        - importedAt
        - lastCheckedAt
        - originalSources
        - dataStatus
        - legalAdviceWarning
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        chamber:
          type: string
          enum:
            - SENATE
            - DEPUTIES
        statusLabelForUsers:
          type: string
        scheduledTreatmentDate:
          type: string
        committees:
          type: array
          items:
            type: string
        officialDescription:
          type: string
        plainLanguageSummary:
          type: string
        summary:
          $ref: "#/components/schemas/PlainLanguageSummary"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/AffectedTopic"
        affectedGroups:
          type: array
          items:
            $ref: "#/components/schemas/AffectedGroup"
        diffs:
          type: array
          items:
            $ref: "#/components/schemas/LegalDiff"
        queryExamples:
          type: array
          items:
            type: string
        source:
          $ref: "#/components/schemas/LegalSource"
        sourceLinks:
          $ref: "#/components/schemas/ChangeProposalSourceLinks"
        sourceStatus:
          type: string
          enum:
            - LOADED
            - PENDING
        priority:
          type: string
        dataKind:
          type: string
          enum:
            - REAL_AGENDA_ITEM
        importedFrom:
          type: string
        importedAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: string
          format: date-time
        originalSources:
          type: object
          required:
            - current
            - proposed
          properties:
            current:
              $ref: "#/components/schemas/OriginalLegalSource"
            proposed:
              $ref: "#/components/schemas/OriginalLegalSource"
        dataStatus:
          type: string
        scopeNote:
          type: string
        legalAdviceWarning:
          type: string
    PlainLanguageSummary:
      type: object
      required:
        - headline
        - short
        - keyPoints
        - whatItMeans
        - limitations
        - legalAdviceWarning
      properties:
        headline:
          type: string
        short:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        whatItMeans:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        legalAdviceWarning:
          type: string
    AffectedTopic:
      type: object
      required:
        - id
        - label
        - summaryPlainLanguage
      properties:
        id:
          type: string
        label:
          type: string
        summaryPlainLanguage:
          type: string
    AffectedGroup:
      type: object
      required:
        - id
        - label
        - impactSummary
      properties:
        id:
          type: string
        label:
          type: string
        impactSummary:
          type: string
    LegalDiff:
      type: object
      required:
        - id
        - proposalId
        - title
        - changeType
        - affectedTopicIds
        - affectedGroupIds
        - currentVersion
        - proposedVersion
        - explanationPlainLanguage
        - practicalImpact
        - source
        - dataStatus
      properties:
        id:
          type: string
        proposalId:
          type: string
        title:
          type: string
        changeType:
          type: string
          enum:
            - ADDED
            - REMOVED
            - MODIFIED
        affectedTopicIds:
          type: array
          items:
            type: string
        affectedGroupIds:
          type: array
          items:
            type: string
        currentVersion:
          $ref: "#/components/schemas/LegalVersion"
        proposedVersion:
          $ref: "#/components/schemas/LegalVersion"
        explanationPlainLanguage:
          type: string
        practicalImpact:
          type: string
        impactLevel:
          type: string
        source:
          $ref: "#/components/schemas/LegalSource"
        dataStatus:
          type: string
    LegalVersion:
      type: object
      required:
        - id
        - label
        - text
        - status
        - source
        - sourceStatus
        - originalSource
      properties:
        id:
          type: string
        label:
          type: string
        legalItemId:
          type: string
        legalItemTitle:
          type: string
        provisionId:
          type: string
        provisionLabel:
          type: string
        text:
          type: string
        status:
          type: string
        source:
          $ref: "#/components/schemas/LegalSource"
        sourceStatus:
          type: string
          enum:
            - LOADED
            - PENDING
        originalSource:
          $ref: "#/components/schemas/OriginalLegalSource"
    OriginalLegalSource:
      type: object
      required:
        - status
        - label
      properties:
        status:
          type: string
          enum:
            - LOADED
            - PENDING
        label:
          type: string
        name:
          type: string
        sourceUrl:
          type: string
        retrievedAt:
          type: string
          format: date-time
        official:
          type: boolean
        note:
          type: string
    ChangeProposalSourceLinks:
      type: object
      required:
        - officialAgendaSourceUrl
      properties:
        officialAgendaSourceUrl:
          type: string
        officialCitationUrl:
          type: string
        proposedTextOriginalUrl:
          type: string
        currentLawOriginalUrl:
          type: string
    LegalSource:
      type: object
      required:
        - id
        - name
        - official
      properties:
        id:
          type: string
        name:
          type: string
        sourceUrl:
          type: string
        retrievedAt:
          type: string
          format: date-time
        official:
          type: boolean
    LegalItemOverview:
      type: object
      required:
        - id
        - title
        - type
        - status
        - summaryPlainLanguage
        - affectedSubjects
        - currentEffects
        - relationshipsSummary
        - freshness
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string
        summaryPlainLanguage:
          type: string
        affectedSubjects:
          type: array
          items:
            type: string
        currentEffects:
          type: object
          required:
            - obligations
            - prohibitions
            - rights
            - sanctions
          properties:
            obligations:
              type: integer
              minimum: 0
            prohibitions:
              type: integer
              minimum: 0
            rights:
              type: integer
              minimum: 0
            sanctions:
              type: integer
              minimum: 0
        relationshipsSummary:
          type: object
          required:
            - modifications
            - regulations
            - caseLaw
            - doctrine
            - administrativeCriteria
            - pendingBills
          properties:
            modifications:
              type: integer
              minimum: 0
            regulations:
              type: integer
              minimum: 0
            caseLaw:
              type: integer
              minimum: 0
            doctrine:
              type: integer
              minimum: 0
            administrativeCriteria:
              type: integer
              minimum: 0
            pendingBills:
              type: integer
              minimum: 0
        freshness:
          $ref: "#/components/schemas/FreshnessInfo"
    FreshnessInfo:
      type: object
      required:
        - status
        - pendingValidationCount
      properties:
        status:
          type: string
          enum:
            - UPDATED
            - PARTIAL
            - STALE
            - UNKNOWN
        lastValidatedAt:
          type: string
          format: date-time
        lastSourceCheckedAt:
          type: string
          format: date-time
        pendingValidationCount:
          type: integer
          minimum: 0
